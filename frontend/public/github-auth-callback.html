<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub sign-in</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0b; color: #ece5d8; font: 15px system-ui, sans-serif; }
      main { text-align: center; padding: 32px; max-width: 520px; }
      p { color: #a7a7a7; }
      button { margin-top: 12px; padding: 10px 16px; border: 1px solid #444; border-radius: 8px; background: #171717; color: #fff; cursor: pointer; }
      .error { color: #ff8e8e; }
    </style>
  </head>
  <body>
    <main>
      <p id="message">Completing GitHub sign-in…</p>
      <button id="close" type="button" hidden>Close window</button>
    </main>
    <script>
      (async function () {
        const message = document.getElementById('message');
        const closeButton = document.getElementById('close');
        const params = new URLSearchParams(window.location.search);
        const handoff = params.get('handoff');
        const error = params.get('error');

        const closeSelf = () => {
          try { window.close(); } catch (_) {}
          closeButton.hidden = false;
        };
        closeButton.addEventListener('click', closeSelf);

        if (error) {
          message.className = 'error';
          message.textContent = error;
          closeSelf();
          return;
        }

        if (!handoff) {
          message.className = 'error';
          message.textContent = 'Missing GitHub sign-in code.';
          closeSelf();
          return;
        }

        const backendOrigin = params.get('backend');
        if (!backendOrigin) {
          message.className = 'error';
          message.textContent = 'Unable to determine the DevDrop backend. Please close this window and try again.';
          closeSelf();
          return;
        }

        try {
          const response = await fetch(`${backendOrigin}/api/auth/github/exchange`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ handoff }),
          });
          const payload = await response.json().catch(() => ({}));

          if (!response.ok || !payload?.success) {
            throw new Error(payload?.message || 'GitHub sign-in failed.');
          }

          const { token, user } = payload.data || {};
          if (!token || !user) throw new Error('GitHub sign-in returned an incomplete session.');

          // localStorage is shared with the existing DevDrop tab because this
          // callback page is now on the frontend origin. Navbar already listens
          // for cross-window storage changes.
          localStorage.setItem('token', token);
          localStorage.setItem('user', JSON.stringify(user));

          // Signal the already-open DevDrop tab immediately. The storage
          // event is delivered to the opener even when window.opener/message
          // handoff is unavailable.
          localStorage.setItem('devdrop_github_auth_complete', String(Date.now()));

          // Keep the existing AuthModal's postMessage path working when the
          // opener survives the OAuth navigation. The storage path above is
          // the fallback when the browser has severed window.opener.
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.postMessage(
                { type: 'github-auth-success', token, user },
                window.location.origin
              );
            }
          } catch (_) {}

          message.textContent = 'Signed in successfully. This window will close…';
          setTimeout(closeSelf, 150);
        } catch (err) {
          message.className = 'error';
          message.textContent = err?.message || 'GitHub sign-in failed.';
          closeSelf();
        }
      })();
    </script>
  </body>
</html>
