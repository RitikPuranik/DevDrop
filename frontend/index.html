<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/Logo.jpeg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevDrop — The marketplace for premium web templates, AI tools, and developer assets." />
    <meta name="theme-color" content="#000000" />

    <!-- Preconnect to Google Fonts to reduce DNS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts async with display=swap to avoid render-blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Mono&display=swap" rel="stylesheet" />

    <!-- Preconnect to Razorpay for faster checkout -->
    <link rel="preconnect" href="https://checkout.razorpay.com" />

    <title>DevDrop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Load Razorpay async — defer so it doesn't block initial render -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </body>
</html>
