<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/Logo.jpeg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevDrop — The marketplace for premium web templates, AI tools, and developer assets." />
    <meta name="theme-color" content="#000000" />
    <link rel="preload" href="/hero-poster.svg" as="image" type="image/svg+xml" fetchpriority="high" />
    <!-- Preconnect to Google Fonts to reduce DNS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without putting the Google Fonts CSS on the critical render path. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      as="style"
      onLoad="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400;1,500;1,600;1,700;1,800;1,900&family=Plus+Jakarta+Sans:wght@400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
    </noscript>

    <title>DevDrop</title>
  </head>
  <body>
    <video
      id="hero-lcp-video"
      src="/dewdrop.s3.mp4"
      preload="auto"
      fetchpriority="high"
      poster="/hero-poster.svg"
      muted
      playsinline
      aria-hidden="true"
      style="position:fixed;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:-1"
    ></video>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
