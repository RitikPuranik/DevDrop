name: Multi-Agent Pipeline Validation
on:
  push:
    branches: [multi-agent-website-pipeline]
  pull_request:
    branches: [main]
jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: node --check src/orchestrator/websiteGeneration.orchestrator.js
      - run: node --check src/services/llm.service.js
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source zip
        run: zip -r DevDrop-multi-agent.zip . -x '.git/*' '*/node_modules/*' 'node_modules/*'
      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: DevDrop-multi-agent-source
          path: DevDrop-multi-agent.zip
          retention-days: 7
