name: Multi-Agent Pipeline Validation
on:
  push:
    branches: [multi-agent-website-pipeline]
  pull_request:
    branches: [main]
jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: node --check src/orchestrator/websiteGeneration.orchestrator.js
      - run: node --check src/services/llm.service.js
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
