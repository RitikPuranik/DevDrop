name: DevDrop Deployment Integration Verify

on:
  push:
    branches:
      - feature/vercel-render-deployment-hardening
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Backend tests
        run: npm test --prefix backend -- --runInBand

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Create source archive
        run: git archive --format=zip --output=DevDrop-Vercel-Render-Integration-FINAL.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: DevDrop-Vercel-Render-Integration-FINAL
          path: DevDrop-Vercel-Render-Integration-FINAL.zip
          if-no-files-found: error
